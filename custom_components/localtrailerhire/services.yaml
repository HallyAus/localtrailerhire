send_message:
  name: Send Message
  description: Send a message to a customer for a specific booking transaction.
  fields:
    transaction_id:
      name: Transaction ID
      description: The UUID of the transaction to send the message to.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:
    message:
      name: Message
      description: The message content to send to the customer.
      required: true
      example: "Thank you for your booking! Your trailer is ready for pickup."
      selector:
        text:
          multiline: true
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

refresh_now:
  name: Refresh Now
  description: Force an immediate refresh of booking data. Refreshes all entries if none specified.
  fields:
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to refresh. Omit to refresh all.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

mark_message_sent:
  name: Mark Message Sent
  description: Manually mark a transaction as having had a confirmation message sent. Use this to prevent duplicate messages after manual intervention.
  fields:
    transaction_id:
      name: Transaction ID
      description: The UUID of the transaction to mark as message sent.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

fire_confirmed_events:
  name: Fire Confirmed Events
  description: Re-scan and fire booking_confirmed events for bookings in the last N hours. Useful for debugging automation triggers without sending messages.
  fields:
    hours_back:
      name: Hours Back
      description: How many hours back to scan for confirmed bookings (default 24).
      required: false
      default: 24
      example: 24
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: hours
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

accept_booking:
  name: Accept Booking
  description: Accept a pending booking request. Calls the transition/accept transition on the Sharetribe transaction.
  fields:
    transaction_id:
      name: Transaction ID
      description: The UUID of the booking transaction to accept.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

decline_booking:
  name: Decline Booking
  description: Decline a pending booking request. Calls the transition/decline transition on the Sharetribe transaction.
  fields:
    transaction_id:
      name: Transaction ID
      description: The UUID of the booking transaction to decline.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

leave_review:
  name: Leave Review
  description: Post a provider review for a completed booking. By default tries `transition/review-1-by-provider` (provider goes first); falls back to `transition/review-2-by-provider` if the customer has already reviewed.
  fields:
    transaction_id:
      name: Transaction ID
      description: The UUID of the booking transaction to review.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:
    rating:
      name: Rating
      description: Star rating (1-5). Defaults to 5.
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 5
          step: 1
    review_content:
      name: Review content
      description: The text of the review. A friendly default is used if omitted.
      required: false
      example: "Great customer, easy communication, trailer back in great shape."
      selector:
        text:
          multiline: true
    transition:
      name: Transition (optional)
      description: Force a specific review transition. Leave empty to auto-select (review-1, falling back to review-2).
      required: false
      selector:
        select:
          options:
            - "transition/review-1-by-provider"
            - "transition/review-2-by-provider"
    config_entry_id:
      name: Config Entry
      description: Which Local Trailer Hire entry to use. Required only if multiple entries are configured.
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

export_customer_history:
  name: Export Customer History
  description: Return the retained customer and booking archive as JSON or CSV. Sensitive fields are included only when their option is enabled.
  fields:
    format:
      name: Format
      required: false
      default: json
      selector:
        select:
          options: [json, csv]
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

clear_customer_history:
  name: Clear Customer History
  description: Permanently delete the customer archive or scrub only sensitive values.
  fields:
    scope:
      name: Scope
      required: false
      default: all
      selector:
        select:
          options: [sensitive, all]
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

sync_message_history:
  name: Sync Message History
  description: Incrementally backfill a bounded batch of conversations and return progress.
  fields:
    batch_size:
      name: Batch Size
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

export_message_history:
  name: Export Message History
  description: Return the opt-in message archive as JSON or CSV.
  fields:
    format:
      name: Format
      required: false
      default: json
      selector:
        select:
          options: [json, csv]
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

clear_message_history:
  name: Clear Message History
  description: Permanently delete all locally archived message content and reset backfill progress.
  fields:
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

auto_review_dry_run:
  name: Auto-Review Dry Run
  description: Show reviewable transaction IDs and retry status without posting a review.
  fields:
    transaction_id:
      name: Transaction ID
      required: false
      selector:
        text:
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire

auto_review_retry_now:
  name: Retry Auto-Review Now
  description: Immediately retry one or all currently reviewable transactions, bypassing the saved backoff.
  fields:
    transaction_id:
      name: Transaction ID
      required: false
      selector:
        text:
    config_entry_id:
      name: Config Entry
      required: false
      selector:
        config_entry:
          integration: localtrailerhire
