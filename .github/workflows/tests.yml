name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov aiohttp voluptuous
      - name: Run unit tests
        run: >-
          pytest tests -q
          --cov=lth_pkg.auto_review
          --cov=lth_pkg.customer_history
          --cov=lth_pkg.message_archive
          --cov=lth_pkg.services
          --cov-report=term-missing
          --cov-fail-under=80
