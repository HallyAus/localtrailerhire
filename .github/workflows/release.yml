name: Release

# Creates a source-archive GitHub release after the validation workflows have
# passed. This matches hacs.json, which deliberately does not enable zip_release.
# Keeping releases manual prevents a push from publishing before CI finishes.
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, localtrailerhire]
    permissions:
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("custom_components/localtrailerhire/manifest.json").read_text())
          tag = f"v{manifest['version']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          print(f"Resolved tag: {tag}")
          PY

      - name: Require successful validation for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("total_count", 0) > len(payload.get("check_runs", [])):
              raise SystemExit("Check-run response was truncated; refusing release")

          required = ("pytest", "Hassfest", "HACS")
          runs = payload.get("check_runs", [])
          for name in required:
              matches = [run for run in runs if run.get("name") == name]
              if not matches:
                  raise SystemExit(f"Required check {name} is missing for {sha}")
              latest = max(matches, key=lambda run: run.get("started_at") or "")
              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  raise SystemExit(f"Required check {name} is not successful for {sha}")
              print(f"Required check passed: {name}")
          PY

      - name: Check release and tag state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          tag = os.environ["TAG"]
          sha = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          local_tag = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
              check=False, capture_output=True, text=True,
          )
          if local_tag.returncode not in (0, 1):
              raise SystemExit("Could not reliably inspect local tag state")
          if local_tag.returncode == 0:
              tag_commit = subprocess.run(
                  ["git", "rev-list", "-n", "1", tag],
                  check=True, capture_output=True, text=True,
              ).stdout.strip()
              if tag_commit != sha:
                  raise SystemExit(f"Existing tag {tag} points to a different commit")

          url = f"https://api.github.com/repos/{repository}/releases/tags/{urllib.parse.quote(tag, safe='')}"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=30):
                  exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          if exists and local_tag.returncode != 0:
              raise SystemExit(f"Release {tag} exists but its local tag ref was not fetched")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          print(f"Release {tag} {'already exists' if exists else 'does not exist'}")
          PY

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ github.token }}
          generate_release_notes: true
          body: |
            Home Assistant integration for the LocalTrailerHire (Sharetribe Flex)
            marketplace. HACS installs this release from GitHub's source archive.

            See the README for the full feature list and the sample dashboard
            at `dashboards/local_trailer_hire.yaml`.
