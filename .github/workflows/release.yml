name: Release

# Creates a source-archive GitHub release after the validation workflows have
# passed. This matches hacs.json, which deliberately does not enable zip_release.
# Keeping releases manual prevents a push from publishing before CI finishes.
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          VER=$(python -c 'import json; print(json.load(open("custom_components/localtrailerhire/manifest.json"))["version"])')
          TAG="v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Require successful validation for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for CHECK in pytest Hassfest HACS; do
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq ".check_runs[] | select(.name == \"$CHECK\") | .conclusion" | head -n 1)
            if [ "$CONCLUSION" != "success" ]; then
              echo "Required check $CHECK is not successful for $GITHUB_SHA"
              exit 1
            fi
          done

      - name: Check release and tag state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, not validated commit $GITHUB_SHA"
              exit 1
            fi
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Home Assistant integration for the LocalTrailerHire (Sharetribe Flex)
            marketplace. HACS installs this release from GitHub's source archive.

            See the README for the full feature list and the sample dashboard
            at `dashboards/local_trailer_hire.yaml`.
